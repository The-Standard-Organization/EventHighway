name: PR Linter
on:
  pull_request:
    types:
    - opened
    - edited
    - synchronize
    - reopened
    - closed
jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
    - name: Apply Label
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: >-
          const prefixes = [
              'MAJOR INFRA:',
              'MEDIUM INFRA:',
              'MINOR INFRA:',
              'INFRA:',
              'MAJOR DATA:',
              'MEDIUM DATA:',
              'MINOR DATA:',
              'DATA:',
              'MAJOR MIGRATION:',
              'MEDIUM MIGRATION:',
              'MINOR MIGRATION:',
              'MIGRATION:',
              'MAJOR BROKER:',
              'MEDIUM BROKER:',
              'MINOR BROKER:',
              'BROKER:',
              'MAJOR FOUNDATION:',
              'MEDIUM FOUNDATION:',
              'MINOR FOUNDATION:',
              'FOUNDATION:',
              'MAJOR PROCESSING:',
              'MEDIUM PROCESSING:',
              'MINOR PROCESSING:',
              'PROCESSING:',
              'MAJOR ORCHESTRATION:',
              'MEDIUM ORCHESTRATION:',
              'MINOR ORCHESTRATION:',
              'ORCHESTRATION:',
              'MAJOR COORDINATION:',
              'MEDIUM COORDINATION:',
              'MINOR COORDINATION:',
              'COORDINATION:',
              'MAJOR MANAGEMENT:',
              'MEDIUM MANAGEMENT:',
              'MINOR MANAGEMENT:',
              'MANAGEMENT:',
              'MAJOR AGGREGATION:',
              'MEDIUM AGGREGATION:',
              'MINOR AGGREGATION:',
              'AGGREGATION:',
              'MAJOR CONTROLLER:',
              'MEDIUM CONTROLLER:',
              'MINOR CONTROLLER:',
              'CONTROLLER:',
              'MAJOR ACCEPTANCE:',
              'MEDIUM ACCEPTANCE:',
              'MINOR ACCEPTANCE:',
              'ACCEPTANCE:',
              'MAJOR INTEGRATION:',
              'MEDIUM INTEGRATION:',
              'MINOR INTEGRATION:',
              'INTEGRATION:',
              'MAJOR VIEW:',
              'MEDIUM VIEW:',
              'MINOR VIEW:',
              'VIEW:',
              'MAJOR BASE:',
              'MEDIUM BASE:',
              'MINOR BASE:',
              'BASE:',
              'MAJOR COMPONENT:',
              'MEDIUM COMPONENT:',
              'MINOR COMPONENT:',
              'COMPONENT:',
              'MAJOR PAGE:',
              'MEDIUM PAGE:',
              'MINOR PAGE:',
              'PAGE:',
              'MAJOR CLIENT:',
              'MEDIUM CLIENT:',
              'MINOR CLIENT:',
              'CLIENT:',
              'MAJOR EXPOSER:',
              'MEDIUM EXPOSER:',
              'MINOR EXPOSER:',
              'EXPOSER:',
              'MAJOR DESIGN:',
              'MEDIUM DESIGN:',
              'MINOR DESIGN:',
              'DESIGN:',
              'MAJOR FIX:',
              'MEDIUM FIX:',
              'MINOR FIX:',
              'MAJOR PLANNING:',
              'MINOR PLANNING:',
              'MINIOR PLANNING:',
              'PLANNING:',
              'MAJOR MENTORSHIP:',
              'MINOR MENTORSHIP:',
              'MINIOR MENTORSHIP:',
              'MENTORSHIP:',
              'MAJOR DISCUSSION:',
              'MINOR DISCUSSION:',
              'MINIOR DISCUSSION:',
              'DISCUSSION:',
              'MAJOR CODE RUB:',
              'MEDIUM CODE RUB:',
              'MINOR CODE RUB:',
              'CODE RUB:',
              'PROVISION:',
              'IMPORT:',
              'RELEASE:',
              'CONFIG:',
              'REVIEW:',
              'DOCUMENTATION:',
              'STANDARD:',
              'BUSINESS:',
              'STATUS:'
          ];


          const pullRequest = context.payload.pull_request;


          if (!pullRequest) {
            console.log('No pull request context available.');
            return;
          }


          const title = context.payload.pull_request.title;

          const existingLabels = context.payload.pull_request.labels.map(label => label.name);


          for (const prefix of prefixes) {
            if (title.startsWith(prefix)) {
              const label = prefix.slice(0, -1);
              if (!existingLabels.includes(label)) {
                console.log(`Applying label: ${label}`);
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: [label]
                });
              }
              break;
            }
          }
    permissions:
      contents: read
      pull-requests: write
      issues: write
  requireIssueOrTask:
    name: Require Issue Or Task Association
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v5
    - name: Get PR Information
      id: get_pr_info
      uses: actions/github-script@v8
      with:
        script: >2-
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number
              });

              const prOwner = pr.data.user.login || "";
              const prBody = pr.data.body || "";
              core.setOutput("prOwner", prOwner);
              core.setOutput("description", prBody);
              console.log(`PR Owner: ${prOwner}`);
              console.log(`PR Body: ${prBody}`);
    - name: Check For Associated Issues Or Tasks
      id: check_for_issues_or_tasks
      if: ${{ !contains(',,', format(',{0},', steps.get_pr_info.outputs.prOwner)) }}
      env:
        PR_BODY: ${{ steps.get_pr_info.outputs.description }}
      run: >2-
            if [[ -z "${PR_BODY:-}" ]]; then
              echo "Error: PR description does not contain any links to issue(s)/task(s) (e.g., 'closes #123' / 'closes AB#123' / 'fixes #123' / 'fixes AB#123')."
              exit 1
            fi

            NORMALIZED_PR_BODY=$(printf '%s' "$PR_BODY" | tr '\r\n' '  ' | tr -s ' ')

            if printf '%s' "$NORMALIZED_PR_BODY" | grep -Piq "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*(\[#[0-9]+\]|#[0-9]+|\[AB#[0-9]+\]|AB#[0-9]+)"; then
              echo "Valid PR description."
            else
              echo "Error: PR description does not contain any links to issue(s)/task(s) (e.g., 'closes #123' / 'closes AB#123' / 'fixes #123' / 'fixes AB#123')."
              exit 1
            fi
      shell: bash
    permissions:
      contents: read
      pull-requests: read
